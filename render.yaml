services:
  - type: web
    name: thay-co-hub-3d-chibi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: '1'
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
